<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintone Record Add Form</title>
    <link rel="stylesheet" href="https://unpkg.com/@kintone/kintone-ui-component@1/dist/kuc.min.css">
    <style>
        body { 
            font-family: sans-serif; 
            padding: 1em; 
            background-color: #f7f9fa;
        }
        .kuc-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2em;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5em;
        }
        #result { margin-top: 1em; }
    </style>
    <script src="https://unpkg.com/@kintone/kintone-ui-component@1/dist/kuc.min.js"></script>
</head>
<body>

    <div class="kuc-container">
        <h1>Kintone Record Add Form</h1>
        <div id="kintone-form"></div>
    </div>
    <div id="result"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formContainer = document.getElementById('kintone-form');
            const resultDiv = document.getElementById('result');

            const nameText = new Kuc.Text({
                label: 'Name',
                requiredIcon: true
            });

            const subjectText = new Kuc.Text({
                label: 'Subject',
                requiredIcon: true
            });

            const addButton = new Kuc.Button({
                text: 'Add Record',
                type: 'submit'
            });

            addButton.addEventListener('click', () => {
                resultDiv.textContent = 'Adding record...';

                const name = nameText.value;
                const subject = subjectText.value;

                if (!name || !subject) {
                    resultDiv.textContent = 'Name and Subject are required.';
                    return;
                }

                // 親ウィンドウにフォームデータを送信
                window.parent.postMessage({
                    type: 'addKintoneRecord',
                    record: {
                        name: { value: name },
                        subject: { value: subject }
                    }
                }, 'https://rpq33ai8jurt.cybozu.com');
                
                resultDiv.textContent = 'Record addition requested.';
            });

            formContainer.appendChild(nameText);
            formContainer.appendChild(subjectText);
            formContainer.appendChild(addButton);
        });
    </script>
</body>
</html>
