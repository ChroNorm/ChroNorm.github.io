<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintone Record Add Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            padding: 2.5em 3em;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #1a202c;
            margin-top: 0;
            margin-bottom: 1.5em;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5em;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
            color: #4a5568;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8em 1em;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }

        button {
            width: 100%;
            padding: 0.9em 1.5em;
            border: none;
            border-radius: 8px;
            background-color: #4299e1;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #3182ce;
        }

        button:active {
            transform: translateY(1px);
        }

        #result {
            margin-top: 1.5em;
            text-align: center;
            font-size: 0.9rem;
        }
        #result.error { color: #e53e3e; }
        #result.success { color: #38a169; }
    </style>
</head>
<body>
    <div class="container">
        <h1>「js書き換テスト」に追加</h1>
        <form id="kintone-form">
            <div class="form-group">
                <label for="name">名前</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="subject">科目</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <button type="submit">レコード追加</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        let kintoneInfo = null;
        let kintoneOrigin = '';

        // kintoneからのデータを受け取る
        window.addEventListener('message', (event) => {
            // 信頼できるオリジンからのメッセージか検証
            // 最初にkintoneInfoを受け取るときは送信元が不明なので、event.data.originの存在で判断
            if (kintoneOrigin && event.origin !== kintoneOrigin) {
                if (!event.data || event.origin !== event.data.origin) return;
            }

            if (event.data && event.data.type === 'kintoneRecordAdded') {
                // レコード追加結果の処理
                return;
            }

            if (event.data && event.data.token) {
                // kintoneの基本情報とオリジンを保存
                kintoneInfo = event.data;
                kintoneOrigin = event.origin;
            }
        });

        document.getElementById('kintone-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.className = '';
            resultDiv.textContent = 'レコードを追加しています...';

            if (!kintoneInfo) {
                resultDiv.textContent = '有効な場所から開かれていません。';
                resultDiv.classList.add('error');
                return;
            }

            const name = document.getElementById('name').value;
            const subject = document.getElementById('subject').value;

            if (!name || !subject) {
                resultDiv.textContent = '名前と件名は必須です。';
                resultDiv.classList.add('error');
                return;
            }

            // 親ウィンドウにフォームデータを送信
            window.parent.postMessage({
                type: 'addKintoneRecord',
                record: {
                    name: { value: name },
                    subject: { value: subject }
                }
            }, kintoneOrigin);
            
            // レコード追加リクエスト送信後、結果はkintoneからのメッセージで更新される
            resultDiv.textContent = 'レコード追加をリクエストしました。結果をお待ちください...';
            resultDiv.classList.remove('success', 'error'); // リクエスト中は色をリセット
        });

        // body要素のサイズ変更を監視して、親ウィンドウに高さを通知する
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                const height = entry.target.offsetHeight;
                window.parent.postMessage({
                    type: 'resizeIframe',
                    height: height
                }, kintoneOrigin);
            }
        });
        resizeObserver.observe(document.body);
    </script>
</body>
</html>
