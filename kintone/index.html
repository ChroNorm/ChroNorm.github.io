<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kintone Record Add Form</title>
    <style>
        body { font-family: sans-serif; padding: 1em; }
        .form-group { margin-bottom: 1em; }
        label { display: block; margin-bottom: .5em; }
        input[type="text"] { width: 100%; padding: .5em; box-sizing: border-box; }
        button { padding: .7em 1.5em; }
        #result { margin-top: 1em; }
    </style>
</head>
<body>

    <h1>Kintone Record Add Form</h1>
    <h3>更新回数:3</h3>
    <form id="kintone-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
        </div>
        <button type="submit">Add Record</button>
    </form>

    <div id="result"></div>

    <script>
        let kintoneInfo = {};

        // kintoneからのデータを受け取る
        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://rpq33ai8jurt.cybozu.com') {
                return;
            }

            if (event.data && event.data.token) {
                kintoneInfo = event.data;
                console.log('Received kintone info:', kintoneInfo);
            }
        });

        document.getElementById('kintone-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Adding record...';

            const name = document.getElementById('name').value;
            const subject = document.getElementById('subject').value;

            // 親ウィンドウにフォームデータを送信
            window.parent.postMessage({
                type: 'addKintoneRecord',
                record: {
                    name: { value: name },
                    subject: { value: subject }
                }
            }, 'https://rpq33ai8jurt.cybozu.com');
            
            resultDiv.textContent = 'Record addition requested.';
        });
    </script>
</body>
</html>
