<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P4Gスキルカード管理</title>
    <link rel="icon" href="favicon.ico">
    <style>
        html {
            overflow-y: scroll;
            height: 100%;
        }

        :root {
            --p4-yellow: #ffe600;
            --p4-black: #101010;
            --p4-gray: #333;
            --p4-orange: #ff6600;
            --p4-green: #00aa00;
            --p4-red: #cc0000;
            /* 背景パターン定義 */
            --p4-bg-pattern: repeating-linear-gradient(45deg,
                    #ffe600,
                    #ffe600 20px,
                    #f5dd00 20px,
                    #f5dd00 40px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, "Meiryo", sans-serif;
            color: var(--p4-black);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        /* --- 背景固定用の疑似要素 --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: var(--p4-bg-pattern);
            background-attachment: fixed;
        }

        /* --- ヘッダーエリア --- */
        header {
            background-color: var(--p4-black);
            color: var(--p4-yellow);
            padding: 15px 30px;
            border-radius: 4px;
            transform: skew(-10deg);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.2);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            margin: 0;
            font-style: italic;
            letter-spacing: 2px;
            transform: skew(10deg);
        }

        .reset-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            transform: skew(10deg);
            transition: all 0.2s;
            border: 2px solid white;
        }

        .reset-btn:hover {
            background-color: #cc0000;
            transform: skew(10deg) scale(1.05);
        }

        /* --------------------------------------- */

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border: 4px solid var(--p4-black);
            box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.8);
            padding: 25px;
            min-height: 80vh;
        }

        .intro-note {
            background-color: #f9f9f9;
            border: 2px dashed #ccc;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 0.9em;
            color: #555;
            line-height: 1.6;
        }

        .intro-note h2 {
            margin: 0 0 5px 0;
            font-size: 1.1em;
            color: var(--p4-black);
            border-bottom: 2px solid var(--p4-yellow);
            display: inline-block;
        }

        /* 統計情報エリア */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-around;
            background: var(--p4-gray);
            color: white;
            padding: 15px;
            margin-bottom: 25px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .stat-item {
            text-align: center;
            min-width: 80px;
        }

        .stat-val {
            font-size: 1.2em;
            display: block;
        }

        .stat-label {
            font-size: 0.8em;
            opacity: 0.8;
        }

        /* コントロールエリア */
        .controls {
            background: rgba(255, 255, 255, 0.98);
            padding: 15px;
            border: 2px solid var(--p4-black);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            padding: 12px;
            border: 2px solid var(--p4-black);
            flex-grow: 1;
            font-size: 16px;
            outline: none;
            background: #f9f9f9;
        }

        input[type="text"]:focus {
            border-color: var(--p4-orange);
            background: #fff;
        }

        /* 複数選択フィルターのボタングループ */
        .multi-filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        .filter-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
            min-width: 250px;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }

        .filter-label {
            font-size: 0.85em;
            font-weight: bold;
            color: #666;
        }

        /* 全選択・クリア トグルボタン */
        .toggle-all-btn {
            background: white;
            border: 1px solid #aaa;
            color: #555;
            font-size: 0.75em;
            cursor: pointer;
            border-radius: 4px;
            padding: 3px 10px;
            font-weight: bold;
            transition: all 0.2s;
            user-select: none;
        }

        .toggle-all-btn:hover {
            background: #eee;
            color: #333;
        }

        .toggle-all-btn.is-clear {
            background: var(--p4-black);
            color: var(--p4-yellow);
            border-color: var(--p4-black);
        }

        .toggle-all-btn.is-clear:hover {
            background: #333;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .filter-chk-btn {
            padding: 6px 12px;
            border: 2px solid #ccc;
            background: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            color: #666;
            border-radius: 4px;
            user-select: none;
            transition: all 0.1s;
        }

        .filter-chk-btn:hover {
            background: #f0f0f0;
        }

        .filter-chk-btn.active {
            border-color: var(--p4-black);
            background: var(--p4-black);
            color: var(--p4-yellow);
        }

        /* お気に入りトグル */
        .fav-filter {
            margin-top: auto;
            align-self: flex-start;
        }

        .filter-chk-btn.fav-filter.active {
            border-color: #d4a000;
            background: #d4a000;
            color: white;
        }

        /* カードリスト */
        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 15px;
        }

        .skill-card {
            border: 2px solid var(--p4-black);
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .skill-header {
            background: var(--p4-black);
            color: white;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 2px solid var(--p4-black);
            min-height: 40px;
        }

        .skill-name {
            font-size: 1em;
            flex-grow: 1;
            margin-right: 5px;
        }

        .category-badge {
            background: var(--p4-yellow);
            color: var(--p4-black);
            padding: 2px 8px;
            font-size: 0.75em;
            font-weight: 800;
            border-radius: 4px;
            white-space: nowrap;
        }

        .fav-star {
            cursor: pointer;
            font-size: 1.4em;
            color: #ccc;
            margin-left: 8px;
            transition: color 0.2s;
            user-select: none;
        }

        .fav-star.active {
            color: #ffd700;
            text-shadow: 0 0 2px black;
        }

        .skill-body {
            padding: 10px;
            flex-grow: 1;
            font-size: 0.85em;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 4px;
        }

        .info-label {
            color: #666;
            font-size: 0.9em;
        }

        .info-val {
            font-weight: bold;
            color: #333;
        }

        .source-section {
            margin-top: 4px;
        }

        .source-label {
            font-size: 0.75em;
            color: #666;
            display: block;
            margin-bottom: 2px;
        }

        .source-text {
            display: block;
            font-weight: 600;
            line-height: 1.3;
            color: #333;
        }

        .source-text.no-source {
            color: #999;
            font-weight: normal;
        }

        .spoiler-mask {
            cursor: pointer;
            user-select: none;
            padding: 0 4px;
            border-radius: 3px;
        }

        .spoiler-revealed {
            background: transparent;
            color: inherit;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ステータスボタン */
        .status-controls {
            display: flex;
            border-top: 2px solid var(--p4-black);
        }

        .status-btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            transition: all 0.1s;
        }

        .status-btn:not(:last-child) {
            border-right: 1px solid var(--p4-black);
        }

        .status-btn {
            background: #e0e0e0;
            color: #999;
        }

        .status-btn:hover {
            background: #d0d0d0;
        }

        .skill-card.status-none .status-btn[data-status="none"] {
            background: var(--p4-red);
            color: white;
        }

        .skill-card.status-extractable .status-btn[data-status="extractable"] {
            background: var(--p4-orange);
            color: white;
        }

        .skill-card.status-owned .status-btn[data-status="owned"] {
            background: var(--p4-green);
            color: white;
        }

        .skill-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
        }

        .skill-card.status-owned {
            border-color: var(--p4-green);
        }

        .skill-card.status-owned .skill-header {
            background: var(--p4-green);
        }

        .skill-card.status-extractable {
            border-color: var(--p4-orange);
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                transform: none;
                text-align: center;
                gap: 10px;
            }

            h1,
            .reset-btn {
                transform: none;
            }

            .container {
                padding: 10px;
                width: 95%;
                margin: 0 auto;
                border-width: 2px;
            }

            .card-list {
                grid-template-columns: 1fr;
            }

            .controls {
                top: 0;
                padding: 10px;
            }

            .filter-chk-btn {
                flex-grow: 1;
                text-align: center;
            }
        }
    </style>
</head>

            <strong style="color:var(--p4-green)">所持:</strong> そのスキルカードを所持している<br>
            という風に使ってくれたらうれしいです<br>
            ※アリ・ダンスはスキルカード化できないので早めに用意するといいかも
        </div>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-val" id="stat-total">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-item" style="color: #ff9999;">
                <span class="stat-val" id="stat-missing">0</span>
                <span class="stat-label">未所持</span>
            </div>
            <div class="stat-item" style="color: var(--p4-orange);">
                <span class="stat-val" id="stat-extractable">0</span>
                <span class="stat-label">抽出可</span>
            </div>
            <div class="stat-item" style="color: var(--p4-green);">
                <span class="stat-val" id="stat-owned">0</span>
                <span class="stat-label">所持</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="stat-percent">0%</span>
                <span class="stat-label">収集率</span>
            </div>
        </div>

        <div class="controls">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="スキル名、ペルソナ名で検索">
            </div>

            <div class="multi-filter-section">
                <div class="filter-block">
                    <div class="filter-header">
                        <span class="filter-label">所持状態</span>
                        <button class="toggle-all-btn" data-target="filter-status"
                            onclick="toggleFilterGroup('filter-status')">全選択</button>
                    </div>
                    <div class="checkbox-group" id="filter-status">
                        <div class="filter-chk-btn" data-val="owned">所持</div>
                        <div class="filter-chk-btn" data-val="extractable">抽出可</div>
                        <div class="filter-chk-btn" data-val="none">未所持</div>
                    </div>
                </div>

                <div class="filter-block">
                    <div class="filter-header">
                        <span class="filter-label">カテゴリ</span>
                        <button class="toggle-all-btn" data-target="filter-category"
                            onclick="toggleFilterGroup('filter-category')">全選択</button>
                    </div>
                    <div class="checkbox-group" id="filter-category">
                        <div class="filter-chk-btn" data-val="物理">物理</div>
                        <div class="filter-chk-btn" data-val="魔法">魔法</div>
                        <div class="filter-chk-btn" data-val="回復・補助">回復・補助</div>
                        <div class="filter-chk-btn" data-val="自動効果">自動効果</div>
                    </div>
                </div>

                <div class="filter-block">
                    <div class="filter-header">
                        <span class="filter-label">ランク</span>
                        <button class="toggle-all-btn" data-target="filter-rank"
                            onclick="toggleFilterGroup('filter-rank')">全選択</button>
                    </div>
                    <div class="checkbox-group" id="filter-rank">
                    </div>
                </div>

                <div class="filter-block" style="flex-grow: 0;">
                    <div class="filter-header">
                        <span class="filter-label">その他</span>
                    </div>
                    <div class="filter-chk-btn fav-filter" id="fav-filter-btn" onclick="toggleFavFilter()">★ お気に入りのみ
                    </div>
                </div>
            </div>
        </div>

        <div id="card-list" class="card-list">
        </div>
    </div>

        // ランクフィルターの動的生成 (初期状態は未選択)
        function setupRankFilters() {
            const container = document.getElementById('filter-rank');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                container.innerHTML += `<div class="filter-chk-btn" data-val="${i}">ランク${i}</div>`;

                    updateToggleBtnState(parentGroup);
                    renderCards();
                });
            });
        }

            if (activeBtns.length === btns.length) {
                // すべて選択されている場合はクリア
                btns.forEach(b => b.classList.remove('active'));
            } else {
                // それ以外はすべて選択
                btns.forEach(b => b.classList.add('active'));
            }

            updateToggleBtnState(groupId);
            renderCards();
        }

        // トグルボタンの表示状態(全選択/クリア)を更新
        function updateToggleBtnState(groupId) {
            const container = document.getElementById(groupId);
            const btns = container.querySelectorAll('.filter-chk-btn');
            const activeBtns = container.querySelectorAll('.filter-chk-btn.active');
            const toggleBtn = document.querySelector(`.toggle-all-btn[data-target="${groupId}"]`);

            if (toggleBtn) {
                if (btns.length > 0 && activeBtns.length === btns.length) {
                    toggleBtn.textContent = 'クリア';
                    toggleBtn.classList.add('is-clear');
                } else {
                    toggleBtn.textContent = '全選択';
                    toggleBtn.classList.remove('is-clear');
                }
            }
        }

        // 起動時に全グループのトグルボタン状態を更新
        function updateAllToggleButtons() {
            updateToggleBtnState('filter-status');
            updateToggleBtnState('filter-category');
            updateToggleBtnState('filter-rank');
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) userState = JSON.parse(saved);

            const favs = localStorage.getItem(FAV_STORAGE_KEY);
            if (favs) userFavorites = JSON.parse(favs);
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
            updateStats();
        }

        function saveFavorites() {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(userFavorites));
        }

        function resetData() {
            if (confirm("データを全てリセットしますか？この操作は取り消せません。")) {
                userState = {};
                userFavorites = [];
                saveState();
                saveFavorites();
                renderCards();
            }
        }

        function setStatus(id, status) {
            if (status === 'none') {
                delete userState[id];
            } else {
                userState[id] = status;
            }
            saveState();

            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.classList.remove('status-none', 'status-extractable', 'status-owned');
                card.classList.add(`status-${status}`);
            }
        }

        function toggleFavorite(id) {
            const index = userFavorites.indexOf(id);
            if (index === -1) {
                userFavorites.push(id);
            } else {
                userFavorites.splice(index, 1);
            }
            saveFavorites();

            const star = document.querySelector(`#card-${id} .fav-star`);
            if (star) {
                star.classList.toggle('active');
                star.textContent = userFavorites.includes(id) ? '★' : '☆';
            }

            const favFilterActive = document.getElementById('fav-filter-btn').classList.contains('active');
            if (favFilterActive) renderCards();
        }

        function toggleFavFilter() {
            const btn = document.getElementById('fav-filter-btn');
            btn.classList.toggle('active');
            renderCards();
        }

        function getCategory(id) {
            if (id >= 100 && id < 200) return "物理";
            if (id >= 200 && id < 300) return "魔法";
            if (id >= 300 && id < 400) return "回復・補助";
            if (id >= 400 && id < 500) return "自動効果";
            return "その他";
        }

        function hiraToKata(str) {
            return str.replace(/[\u3041-\u3096]/g, function (match) {
                var chr = match.charCodeAt(0) + 0x60;
                return String.fromCharCode(chr);
            });
        }

        function revealAllSpoilers(id) {
            if (!confirm("ネタバレ注意！重大なネタバレを含みます。表示しますか？")) return;
            const skill = skillData.find(s => s.id === id);
            if (!skill) return;

            const updateElement = (elementId, text) => {
                const el = document.getElementById(elementId);
                if (el) {
                    el.textContent = text;
                    el.classList.remove('spoiler-mask');
                    el.classList.add('spoiler-revealed');
                    el.onclick = null;
                }
            };

            updateElement(`name-${id}`, skill.name);
            updateElement(`source-${id}`, skill.source);
        }

        // 選択されているフィルターの値を取得するヘルパー関数
        function getActiveFilters(containerId) {
            const activeBtns = document.querySelectorAll(`#${containerId} .filter-chk-btn.active`);
            return Array.from(activeBtns).map(btn => btn.dataset.val);
        }

        function renderCards() {
            const container = document.getElementById('card-list');
            const searchInput = document.getElementById('search-input').value.trim();

            // 各フィルターの選択状態を取得
            const activeStatuses = getActiveFilters('filter-status');
            const activeCategories = getActiveFilters('filter-category');
            const activeRanks = getActiveFilters('filter-rank');
            const favFilterActive = document.getElementById('fav-filter-btn').classList.contains('active');

            const searchTerms = searchInput.toLowerCase().split(/\s+/).map(term => ({
                original: term,
                kata: hiraToKata(term)
            }));

            container.innerHTML = '';
            const fragment = document.createDocumentFragment();

            skillData.forEach(skill => {
                // 1. 状態フィルタ (空配列なら全件表示、それ以外はOR条件)
                const status = userState[skill.id] || 'none';
                if (activeStatuses.length > 0 && !activeStatuses.includes(status)) return;

                // 2. カテゴリフィルタ (空配列なら全件表示、それ以外はOR条件)
                const category = getCategory(skill.id);
                if (activeCategories.length > 0 && !activeCategories.includes(category)) return;

                // 3. ランクフィルタ (空配列なら全件表示、それ以外はOR条件)
                if (activeRanks.length > 0 && !activeRanks.includes(skill.rank.toString())) return;

                // 4. お気に入りフィルタ
                const isFav = userFavorites.includes(skill.id);
                if (favFilterActive && !isFav) return;

                // 5. テキスト検索 (AND条件, ひらがな対応)
                if (searchInput) {
                    const targetText = `${skill.name} ${skill.source}`.toLowerCase();
                    const targetTextKata = hiraToKata(targetText);

                    const isMatch = searchTerms.every(term => {
                        return targetText.includes(term.original) || targetTextKata.includes(term.kata);
                    });

                    if (!isMatch) return;
                }

                // カード生成
                const cardEl = document.createElement('div');
                cardEl.id = `card-${skill.id}`;
                cardEl.className = `skill-card status-${status}`;

                const isSpoiler = (skill.id === 473);
                const nameDisplay = isSpoiler
                    ? `<span id="name-${skill.id}" class="spoiler-mask" onclick="revealAllSpoilers(${skill.id})">???</span>`
                    : skill.name;
                const sourceDisplay = isSpoiler
                    ? `<span id="source-${skill.id}" class="spoiler-mask" onclick="revealAllSpoilers(${skill.id})">???</span>`
                    : skill.source;

                const isUnavailable = (skill.rank === "0" || skill.rank === 0);
                const rankText = isUnavailable ? "入手不可" : `ランク${skill.rank}`;
                const sourceClass = (skill.source === "なし" || skill.source === "???") ? "source-text no-source" : "source-text";
                const costFormatted = skill.cost.toLocaleString() + " 円";

                cardEl.innerHTML = `
                <div class="skill-header">
                    <span class="skill-name">${nameDisplay}</span>
                    <span class="category-badge">${category}</span>
                    <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFavorite(${skill.id})">${isFav ? '★' : '☆'}</span>
                </div>
                <div class="skill-body">
                    <div class="info-row">
                        <span class="info-label">値段</span>
                        <span class="info-val">${costFormatted}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">シャッフルタイム</span>
                        <span class="info-val" style="color:${isUnavailable ? '#999' : '#000'}">${rankText}</span>
                    </div>
                    <div class="source-section">
                        <span class="source-label">抽出ペルソナ:</span>
                        <span class="${sourceClass}">${sourceDisplay}</span>
                    </div>
                </div>
                <div class="status-controls">
                    <button class="status-btn" data-status="none" onclick="setStatus(${skill.id}, 'none')">未所持</button>
                    <button class="status-btn" data-status="extractable" onclick="setStatus(${skill.id}, 'extractable')">抽出可</button>
                    <button class="status-btn" data-status="owned" onclick="setStatus(${skill.id}, 'owned')">所持</button>
                </div>
            `;
                fragment.appendChild(cardEl);
            });

            container.appendChild(fragment);

            if (container.children.length === 0) {
                container.innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:20px; color:#666;">該当するスキルカードが見つかりません</div>';
            }
        }

        function updateStats() {
            const total = skillData.length;
            let owned = 0;
            let extractable = 0;

            const validIds = new Set(skillData.map(s => s.id));

            Object.entries(userState).forEach(([id, status]) => {
                if (validIds.has(parseInt(id))) {
                    if (status === 'owned') owned++;
                    if (status === 'extractable') extractable++;
                }
            });

            const missing = total - owned - extractable;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-owned').textContent = owned;
            document.getElementById('stat-extractable').textContent = extractable;
            document.getElementById('stat-missing').textContent = missing;

            const percent = total === 0 ? 0 : Math.round((owned / total) * 100);
            document.getElementById('stat-percent').textContent = `${percent}%`;
        }
    </script>
</body>

</html>
